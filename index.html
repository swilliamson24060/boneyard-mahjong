<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170f24">
<meta name="description" content="A Halloween Mah Jong solitaire: thirteen boards from dusk to dawn.">
<meta property="og:title" content="Boneyard Mah Jong">
<meta property="og:description" content="A Halloween Mah Jong solitaire: thirteen boards from dusk to dawn, and at midnight every tile turns over.">
<meta property="og:image" content="https://swilliamson24060.github.io/boneyard-mahjong/icons/icon-512.png">
<meta property="og:url" content="https://swilliamson24060.github.io/boneyard-mahjong/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Boneyard Mah Jong</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
  <header class="bar top">
    <h1>Boneyard</h1>
    <span id="where"></span>
    <button id="menu" type="button" title="The Long Night">☾<span class="label"> The night</span></button>
    <button id="new" type="button" title="A new deal (N)" hidden>↻<span class="label"> New deal</span></button>
    <button id="sound" type="button" title="Sound (M)">🔊</button>
    <div class="status">
      <span id="clock" hidden></span>
      <span id="souls" hidden></span>
      <span id="left"></span>
      <span id="score" title="Score"></span>
      <span id="time"></span>
    </div>
  </header>
  <main id="table"><div id="board" aria-label="The board"></div></main>
  <footer class="bar bottom">
    <button id="undo" type="button" title="Undo (U)">↶<span class="label"> Undo</span></button>
    <button id="hint" type="button" title="A hint, for 15 seconds (H)">🔮<span class="label"> Hint</span></button>
    <button id="shuffle" type="button" title="Shuffle, for 30 seconds (S)">🔀<span class="label"> Shuffle</span></button>
    <button id="moon" type="button" title="Hold to see the night side (or hold Space)">🌙<span class="label"> Peek</span></button>
    <span class="treats">
      <button id="candle" type="button" title="A candle shows you a match">🕯️ <b>0</b></button>
      <button id="key" type="button" title="A skeleton key frees one blocked tile">🗝️ <b>0</b></button>
      <button id="cat" type="button" title="A black cat shuffles for free">🐈‍⬛ <b>0</b></button>
    </span>
  </footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="card" hidden>
    <div class="inner" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <h2 id="card-title"></h2>
      <p id="card-text"></p>
      <table class="score" id="card-score" hidden></table>
      <div class="hours" id="card-grid" hidden></div>
      <div class="actions" id="card-actions"></div>
      <div class="options" id="card-options" hidden>
        <label><input type="checkbox" id="magnify"> 🔍 Hold a tile to see it up close</label>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
